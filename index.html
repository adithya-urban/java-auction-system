<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Auction System</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f9fafb;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --border-focus: #111827;
      --primary: #111827;
      --primary-hover: #1f2937;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-border: #a7f3d0;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
      --radius: 6px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-mark {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius);
      background: var(--bg-secondary);
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-select-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    select.clean-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.35rem 0.65rem;
      font-size: 0.875rem;
      outline: none;
      cursor: pointer;
    }

    select.clean-select:focus {
      border-color: var(--border-focus);
    }

    .wallet-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius);
      background: var(--bg-secondary);
    }

    .wallet-amount {
      font-weight: 600;
      color: var(--text);
    }

    /* Layout Container */
    main {
      flex: 1;
      max-width: 1040px;
      margin: 0 auto;
      width: 100%;
      padding: 2rem 1.5rem;
    }

    /* Top Summary Bar */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--bg);
    }

    .summary-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      display: block;
    }

    .summary-value {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .tab-button {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-button:hover {
      color: var(--text);
    }

    .tab-button.active {
      color: var(--text);
      border-bottom-color: var(--primary);
    }

    .tab-count {
      font-size: 0.75rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.05rem 0.4rem;
      border-radius: 4px;
    }

    /* Search Input */
    .search-row {
      margin-bottom: 1.25rem;
    }

    .input-text {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.55rem 0.85rem;
      font-size: 0.875rem;
      outline: none;
      background: var(--bg);
      color: var(--text);
    }

    .input-text:focus {
      border-color: var(--border-focus);
    }

    /* Item Grid & Cards */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .auction-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      gap: 0.75rem;
    }

    .item-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .status-active {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .status-sold {
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status-unsold {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .item-description {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex: 1;
      line-height: 1.45;
    }

    .item-meta-table {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1rem;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }

    .item-meta-table td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .item-meta-table tr:last-child td {
      border-bottom: none;
    }

    .meta-label {
      color: var(--text-muted);
      width: 45%;
    }

    .meta-value {
      font-weight: 600;
      color: var(--text);
      text-align: right;
    }

    .meta-timer {
      font-weight: 600;
      color: #b45309;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .bid-controls {
      display: flex;
      gap: 0.5rem;
    }

    .bid-amount-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.45rem 0.65rem;
      font-size: 0.875rem;
      outline: none;
    }

    .bid-amount-input:focus {
      border-color: var(--border-focus);
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 0.45rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      text-decoration: none;
      transition: background-color 0.1s ease;
    }

    .btn-dark {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-dark:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--bg-secondary);
    }

    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Create Auction Form */
    .form-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      background: var(--bg);
      max-width: 540px;
    }

    .panel-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .panel-subtitle {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
      color: var(--text);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    textarea.input-text {
      resize: vertical;
      min-height: 80px;
    }

    /* Data Table */
    .table-frame {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }

    table.clean-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }

    table.clean-table th {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    table.clean-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    table.clean-table tr:last-child td {
      border-bottom: none;
    }

    /* Notice / Notification Banner */
    #notificationBanner {
      display: none;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      border: 1px solid transparent;
    }

    #notificationBanner.success {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    #notificationBanner.error {
      background: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-border);
    }

    .empty-message {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    @media (max-width: 768px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .form-row {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <span class="brand-mark">AUC</span>
      <span class="brand-name">Auction System</span>
    </div>

    <div class="user-controls">
      <div class="user-select-wrap">
        <span>Account:</span>
        <select id="userSelect" class="clean-select" onchange="switchUser(this.value)">
          <option value="alice">Alice (Seller & Bidder)</option>
          <option value="bob">Bob (Seller & Bidder)</option>
          <option value="charlie">Charlie (New Bidder)</option>
        </select>
      </div>

      <div class="wallet-box">
        <span style="color: var(--text-muted);">Balance:</span>
        <span class="wallet-amount" id="walletBalance">$1,000.00</span>
        <button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="promptDeposit()">+ Deposit</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main>
    <!-- System Feedback Banner -->
    <div id="notificationBanner"></div>

    <!-- Summary Statistics -->
    <div class="summary-grid">
      <div class="summary-card">
        <span class="summary-label">Active Listings</span>
        <div class="summary-value" id="statActive">2</div>
      </div>
      <div class="summary-card">
        <span class="summary-label">Bids Placed</span>
        <div class="summary-value" id="statBids">0</div>
      </div>
      <div class="summary-card">
        <span class="summary-label">Completed Sales</span>
        <div class="summary-value" id="statSold">0</div>
      </div>
      <div class="summary-card">
        <span class="summary-label">Storage Engine</span>
        <div class="summary-value" style="font-size: 1.125rem; font-weight: 500; color: var(--text-muted); margin-top: 0.25rem;">In-Memory (Java Sync)</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-button active" onclick="setTab('browse', this)">
        <span>Active Auctions</span>
        <span class="tab-count" id="browseBadge">2</span>
      </button>
      <button class="tab-button" onclick="setTab('create', this)">
        <span>Create Listing</span>
      </button>
      <button class="tab-button" onclick="setTab('my-auctions', this)">
        <span>My Listings</span>
      </button>
      <button class="tab-button" onclick="setTab('won', this)">
        <span>Won Auctions</span>
      </button>
      <button class="tab-button" onclick="setTab('history', this)">
        <span>Bid Ledger</span>
      </button>
    </nav>

    <!-- SECTION 1: Active Auctions -->
    <section id="section-browse">
      <div class="search-row">
        <input type="text" id="searchInput" class="input-text" placeholder="Filter listings by title or description..." oninput="renderAuctions()">
      </div>
      <div class="item-grid" id="auctionGrid">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- SECTION 2: Create Listing Form -->
    <section id="section-create" style="display: none;">
      <div class="form-panel">
        <h2 class="panel-title">Create an Auction Listing</h2>
        <p class="panel-subtitle">Items become immediately visible to all bidders upon creation.</p>

        <div class="form-group">
          <label class="form-label" for="itemTitle">Item Title</label>
          <input type="text" id="itemTitle" class="input-text" placeholder="e.g. Mechanical Watch, 1968 Edition">
        </div>

        <div class="form-group">
          <label class="form-label" for="itemDesc">Description</label>
          <textarea id="itemDesc" class="input-text" placeholder="Provide item condition, history, and specifications..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="itemPrice">Starting Price ($)</label>
            <input type="number" id="itemPrice" class="input-text" placeholder="50.00" min="1" step="0.5">
          </div>
          <div class="form-group">
            <label class="form-label" for="itemDuration">Duration (Minutes)</label>
            <input type="number" id="itemDuration" class="input-text" value="30" min="1">
          </div>
        </div>

        <button class="btn btn-dark" style="margin-top: 0.5rem;" onclick="createAuction()">Publish Listing</button>
      </div>
    </section>

    <!-- SECTION 3: My Listings -->
    <section id="section-my-auctions" style="display: none;">
      <div class="item-grid" id="myAuctionGrid">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- SECTION 4: Won Items -->
    <section id="section-won" style="display: none;">
      <div class="item-grid" id="wonAuctionGrid">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- SECTION 5: Bid History Ledger -->
    <section id="section-history" style="display: none;">
      <div class="table-frame">
        <table class="clean-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Item</th>
              <th>Bidder</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="bidHistoryTable">
            <!-- Rendered dynamically -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // State matching pure Java models
    const users = {
      alice: { id: "u-1", name: "Alice", email: "alice@email.com", balance: 1000.0 },
      bob: { id: "u-2", name: "Bob", email: "bob@email.com", balance: 1000.0 },
      charlie: { id: "u-3", name: "Charlie", email: "charlie@email.com", balance: 1000.0 }
    };

    let currentUserKey = "alice";

    // Pre-seeded demo auctions matching AuctionApp.java
    let auctions = [
      {
        id: "item-101",
        sellerKey: "alice",
        sellerName: "Alice",
        title: "Vintage Watch",
        desc: "A well-preserved mechanical timepiece from the 1960s with authentic leather strap.",
        startPrice: 100.0,
        currentBid: 100.0,
        highestBidderKey: null,
        highestBidderName: null,
        endTime: Date.now() + 30 * 60 * 1000,
        status: "ACTIVE"
      },
      {
        id: "item-102",
        sellerKey: "bob",
        sellerName: "Bob",
        title: "Gaming Laptop",
        desc: "High-performance laptop equipped with an RTX 4070 GPU, 32GB DDR5 RAM, and 1TB SSD.",
        startPrice: 500.0,
        currentBid: 500.0,
        highestBidderKey: null,
        highestBidderName: null,
        endTime: Date.now() + 45 * 60 * 1000,
        status: "ACTIVE"
      }
    ];

    let bidLedger = [];

    // Switch simulated user
    function switchUser(key) {
      currentUserKey = key;
      updateHeader();
      renderAuctions();
      renderMyAuctions();
      renderWonAuctions();
      notify(`Active user switched to ${users[key].name}.`, "success");
    }

    function updateHeader() {
      const user = users[currentUserKey];
      document.getElementById("walletBalance").innerText = `$${user.balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function promptDeposit() {
      const input = prompt("Enter deposit amount ($):", "250.00");
      if (input === null) return;
      const amount = parseFloat(input);
      if (isNaN(amount) || amount <= 0) {
        notify("Deposit cancelled: Please enter a valid positive dollar amount.", "error");
        return;
      }
      users[currentUserKey].balance += amount;
      updateHeader();
      notify(`$${amount.toFixed(2)} deposited into ${users[currentUserKey].name}'s wallet.`, "success");
    }

    // Navigation Tabs
    function setTab(tabName, el) {
      document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
      if (el) el.classList.add("active");

      document.getElementById("section-browse").style.display = tabName === "browse" ? "block" : "none";
      document.getElementById("section-create").style.display = tabName === "create" ? "block" : "none";
      document.getElementById("section-my-auctions").style.display = tabName === "my-auctions" ? "block" : "none";
      document.getElementById("section-won").style.display = tabName === "won" ? "block" : "none";
      document.getElementById("section-history").style.display = tabName === "history" ? "block" : "none";

      if (tabName === "my-auctions") renderMyAuctions();
      if (tabName === "won") renderWonAuctions();
      if (tabName === "history") renderBidHistory();
    }

    // Expiration check identical to Java checkAndCloseExpiredAuctions
    function checkExpirations() {
      const now = Date.now();
      let modified = false;

      auctions.forEach(item => {
        if (item.status === "ACTIVE" && now >= item.endTime) {
          if (item.highestBidderKey) {
            item.status = "SOLD";
            // Deduct winner, credit seller
            users[item.highestBidderKey].balance -= item.currentBid;
            users[item.sellerKey].balance += item.currentBid;
            notify(`Auction Ended: "${item.title}" was sold to ${users[item.highestBidderKey].name} for $${item.currentBid.toFixed(2)}.`, "success");
          } else {
            item.status = "UNSOLD";
            notify(`Auction Ended: "${item.title}" closed without qualifying bids.`, "error");
          }
          modified = true;
        }
      });

      if (modified) {
        updateHeader();
        updateStats();
        renderAuctions();
        renderMyAuctions();
        renderWonAuctions();
      }
    }

    setInterval(checkExpirations, 1000);

    function formatTimeRemaining(ms) {
      if (ms <= 0) return "Expired";
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}m ${s < 10 ? '0' : ''}${s}s`;
    }

    // Render Active Auctions
    function renderAuctions() {
      const container = document.getElementById("auctionGrid");
      const query = document.getElementById("searchInput").value.toLowerCase();
      const activeList = auctions.filter(a =>
        a.status === "ACTIVE" &&
        (a.title.toLowerCase().includes(query) || a.desc.toLowerCase().includes(query))
      );

      document.getElementById("browseBadge").innerText = activeList.length;

      if (activeList.length === 0) {
        container.innerHTML = `<div class="empty-message" style="grid-column: 1 / -1;">No active listings found matching your search criteria.</div>`;
        return;
      }

      container.innerHTML = activeList.map(item => {
        const remaining = item.endTime - Date.now();
        const isOwner = item.sellerKey === currentUserKey;
        const minNextBid = (item.highestBidderKey ? item.currentBid + 1 : item.startPrice);

        return `
          <div class="auction-item">
            <div class="item-header">
              <h3 class="item-name">${escapeHtml(item.title)}</h3>
              <span class="status-badge status-active">Active</span>
            </div>
            <p class="item-description">${escapeHtml(item.desc)}</p>

            <table class="item-meta-table">
              <tr>
                <td class="meta-label">Seller</td>
                <td class="meta-value">${escapeHtml(item.sellerName)} ${isOwner ? "(You)" : ""}</td>
              </tr>
              <tr>
                <td class="meta-label">${item.highestBidderKey ? "Current High Bid" : "Starting Price"}</td>
                <td class="meta-value">$${item.currentBid.toFixed(2)}</td>
              </tr>
              <tr>
                <td class="meta-label">Leading Bidder</td>
                <td class="meta-value">${item.highestBidderName ? escapeHtml(item.highestBidderName) : "None yet"}</td>
              </tr>
              <tr>
                <td class="meta-label">Time Remaining</td>
                <td class="meta-timer" id="timer-${item.id}">${formatTimeRemaining(remaining)}</td>
              </tr>
            </table>

            <div class="bid-controls">
              <input type="number" id="bid-input-${item.id}" class="bid-amount-input"
                placeholder="Min $${minNextBid.toFixed(2)}"
                ${isOwner ? 'disabled value="" placeholder="Your Listing"' : ''}
              />
              <button class="btn btn-dark ${isOwner ? 'btn-disabled' : ''}"
                ${isOwner ? 'disabled' : `onclick="handleBid('${item.id}')"`}>
                Place Bid
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Bid Placement with Java backend validation logic
    function handleBid(itemId) {
      const item = auctions.find(a => a.id === itemId);
      if (!item) return;

      const input = document.getElementById(`bid-input-${itemId}`);
      const amount = parseFloat(input.value);

      // Validation 1: Seller cannot bid on own item
      if (item.sellerKey === currentUserKey) {
        notify("Validation Error: Sellers cannot place bids on their own listings.", "error");
        return;
      }

      // Validation 2: Number check
      if (isNaN(amount) || amount <= 0) {
        notify("Validation Error: Please provide a valid positive dollar amount.", "error");
        return;
      }

      // Validation 3: Must exceed current highest bid
      const threshold = item.highestBidderKey ? item.currentBid : item.startPrice;
      if (amount <= threshold) {
        notify(`Validation Error: Bid must be strictly greater than $${threshold.toFixed(2)}.`, "error");
        return;
      }

      // Validation 4: Solvency check
      if (users[currentUserKey].balance < amount) {
        notify(`Validation Error: Insufficient funds. Available: $${users[currentUserKey].balance.toFixed(2)}, Bid: $${amount.toFixed(2)}.`, "error");
        return;
      }

      // Record bid
      item.currentBid = amount;
      item.highestBidderKey = currentUserKey;
      item.highestBidderName = users[currentUserKey].name;

      bidLedger.unshift({
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        itemTitle: item.title,
        bidder: users[currentUserKey].name,
        amount: amount,
        status: "Accepted"
      });

      updateStats();
      renderAuctions();
      notify(`Bid of $${amount.toFixed(2)} accepted on "${item.title}".`, "success");
    }

    // Create New Auction Listing
    function createAuction() {
      const title = document.getElementById("itemTitle").value.trim();
      const desc = document.getElementById("itemDesc").value.trim();
      const price = parseFloat(document.getElementById("itemPrice").value);
      const duration = parseInt(document.getElementById("itemDuration").value);

      if (!title || !desc || isNaN(price) || price <= 0 || isNaN(duration) || duration <= 0) {
        notify("Validation Error: All fields are required and must contain valid values.", "error");
        return;
      }

      const item = {
        id: "item-" + (100 + auctions.length + 1),
        sellerKey: currentUserKey,
        sellerName: users[currentUserKey].name,
        title: title,
        desc: desc,
        startPrice: price,
        currentBid: price,
        highestBidderKey: null,
        highestBidderName: null,
        endTime: Date.now() + duration * 60 * 1000,
        status: "ACTIVE"
      };

      auctions.unshift(item);

      // Reset form
      document.getElementById("itemTitle").value = "";
      document.getElementById("itemDesc").value = "";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemDuration").value = "30";

      updateStats();
      renderAuctions();
      notify(`Listing "${title}" published successfully.`, "success");

      // Switch back to browse
      document.querySelectorAll(".tab-button")[0].click();
    }

    // My Listings Tab
    function renderMyAuctions() {
      const container = document.getElementById("myAuctionGrid");
      const list = auctions.filter(a => a.sellerKey === currentUserKey);

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-message" style="grid-column: 1 / -1;">You have not published any auction listings yet.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="auction-item">
          <div class="item-header">
            <h3 class="item-name">${escapeHtml(item.title)}</h3>
            <span class="status-badge ${item.status === 'ACTIVE' ? 'status-active' : item.status === 'SOLD' ? 'status-sold' : 'status-unsold'}">
              ${item.status}
            </span>
          </div>
          <p class="item-description">${escapeHtml(item.desc)}</p>
          <table class="item-meta-table">
            <tr>
              <td class="meta-label">Starting Price</td>
              <td class="meta-value">$${item.startPrice.toFixed(2)}</td>
            </tr>
            <tr>
              <td class="meta-label">Highest Bid</td>
              <td class="meta-value">$${item.currentBid.toFixed(2)}</td>
            </tr>
            <tr>
              <td class="meta-label">Top Bidder</td>
              <td class="meta-value">${item.highestBidderName ? escapeHtml(item.highestBidderName) : "None"}</td>
            </tr>
          </table>
        </div>
      `).join('');
    }

    // Won Auctions Tab
    function renderWonAuctions() {
      const container = document.getElementById("wonAuctionGrid");
      const list = auctions.filter(a => a.status === "SOLD" && a.highestBidderKey === currentUserKey);

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-message" style="grid-column: 1 / -1;">You have not won any auctions yet. Placed bids will appear here once listings close.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="auction-item">
          <div class="item-header">
            <h3 class="item-name">${escapeHtml(item.title)}</h3>
            <span class="status-badge status-sold">Purchased</span>
          </div>
          <p class="item-description">${escapeHtml(item.desc)}</p>
          <table class="item-meta-table">
            <tr>
              <td class="meta-label">Seller</td>
              <td class="meta-value">${escapeHtml(item.sellerName)}</td>
            </tr>
            <tr>
              <td class="meta-label">Winning Price</td>
              <td class="meta-value">$${item.currentBid.toFixed(2)}</td>
            </tr>
          </table>
        </div>
      `).join('');
    }

    // Ledger History
    function renderBidHistory() {
      const tbody = document.getElementById("bidHistoryTable");
      if (bidLedger.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No bids recorded during this session.</td></tr>`;
        return;
      }

      tbody.innerHTML = bidLedger.map(b => `
        <tr>
          <td style="color: var(--text-muted); font-variant-numeric: tabular-nums;">${b.time}</td>
          <td style="font-weight: 500;">${escapeHtml(b.itemTitle)}</td>
          <td>${escapeHtml(b.bidder)}</td>
          <td style="font-weight: 600;">$${b.amount.toFixed(2)}</td>
          <td><span class="status-badge status-active">${b.status}</span></td>
        </tr>
      `).join('');
    }

    function updateStats() {
      document.getElementById("statActive").innerText = auctions.filter(a => a.status === "ACTIVE").length;
      document.getElementById("statBids").innerText = bidLedger.length;
      document.getElementById("statSold").innerText = auctions.filter(a => a.status === "SOLD").length;
    }

    // System banner notice
    let bannerTimer = null;
    function notify(message, type = "success") {
      const el = document.getElementById("notificationBanner");
      el.className = type;
      el.innerText = message;
      el.style.display = "block";
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        el.style.display = "none";
      }, 4000);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Initial load
    updateHeader();
    updateStats();
    renderAuctions();

    // Timer interval for live countdown numbers
    setInterval(() => {
      auctions.forEach(item => {
        if (item.status === "ACTIVE") {
          const el = document.getElementById(`timer-${item.id}`);
          if (el) {
            el.innerText = formatTimeRemaining(item.endTime - Date.now());
          }
        }
      });
    }, 1000);
  </script>
</body>
</html>
